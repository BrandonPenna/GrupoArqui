server:
  port: 8081

spring:
  application:
    name: catalogo-service
  datasource:
    url: jdbc:h2:file:./data/db_catalogo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ticketya:
  ventas:
    url: http://localhost:8082
