server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            #Ruta a catalogo-service
            - id: catalogo-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/eventos/**,/api/lugares/**

            #Ruta a ventas-service
            - id: ventas-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/reservas/**,/api/compras/**,/api/devoluciones/**
