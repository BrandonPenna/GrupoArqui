server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            #Ruta a catalogo-service (lugares, eventos, preferencias/recomendaciones NoSQL y autenticacion JWT)
            - id: catalogo-service
              uri: ${CATALOGO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/eventos/**,/api/lugares/**,/api/preferencias/**,/api/auth/**

            #Ruta a ventas-service (reservas, compras, devoluciones, fila virtual, control de acceso QR y reportes)
            - id: ventas-service
              uri: ${VENTAS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/reservas/**,/api/compras/**,/api/devoluciones/**,/api/accesos/**,/api/reportes/**,/api/fila-virtual/**

            #Documentación OpenAPI de cada servicio (la usa el Swagger del gateway)
            - id: catalogo-docs
              uri: ${CATALOGO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/catalogo/v3/api-docs
              filters:
                - StripPrefix=1

            - id: ventas-docs
              uri: ${VENTAS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/ventas/v3/api-docs
              filters:
                - StripPrefix=1

#Swagger con los dos servicios en http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    urls:
      - name: catalogo-service
        url: /catalogo/v3/api-docs
      - name: ventas-service
        url: /ventas/v3/api-docs
